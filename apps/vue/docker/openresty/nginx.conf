server {
    listen 80;
    server_name localhost;

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Serve static files for SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    # Proxy to auth-server for /connect/
    location /connect/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream auth-server:44385;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host auth-server:44385;
    }

    # Proxy static file APIs
    location ~ /api/files/static/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream apigateway:30000;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host apigateway:30000;
    }

    # Proxy other /api/ endpoints with Lua to remove RequestVerificationToken
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream auth-server-api:30015;
        access_by_lua_block {
            -- Completely remove RequestVerificationToken header
            ngx.req.get_headers()["RequestVerificationToken"] = nil
        }
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host $host;
    }

    # Proxy external weather API
    location ^~/wapi/ {
        proxy_pass http://www.nmc.cn$request_uri;
        proxy_set_header Host www.nmc.cn;
        proxy_set_header Referer http://www.nmc.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy SignalR hubs
    location /signalr-hubs/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream apigateway:30000;
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
